# Render Blueprint: one web service that runs the API and serves the React website.
# In the Render dashboard: New > Blueprint > pick this repo. Render reads this file.
services:
  - type: web
    name: pdf-analyzer
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: JWT_SECRET
        generateValue: true # Render creates a long random secret for you
      # sync: false = Render asks you to paste these when you create the service.
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
